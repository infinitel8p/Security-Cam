# MediaMTX config for Security Cam
# Minimal config

logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1472

# No authentication needed on local network
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: metrics
      - action: pprof

# Control API (disabled)
api: no

# RTSP - needed for recording via ffmpeg
rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, tcp]
rtspEncryption: "no"
rtpAddress: :8000
rtcpAddress: :8001

# RTMP (disabled - not needed)
rtmp: no

# HLS (disabled - using WebRTC instead)
hls: no

# WebRTC - main protocol for the dashboard
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8190
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList: []
# Set this to your Pi's IP if WebRTC connectivity issues occur:
# webrtcAdditionalHosts: [192.168.x.x]
webrtcAdditionalHosts: []
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s
webrtcSTUNGatherTimeout: 5s

# SRT (disabled)
srt: no

# Default path settings
pathDefaults:
  source: publisher
  sourceOnDemand: no
  maxReaders: 0

# Paths
paths:
  cam:
    source: rpiCamera
    rpiCameraWidth: 1296
    rpiCameraHeight: 972
    rpiCameraFPS: 30
    rpiCameraBitrate: 1000000
    rpiCameraCodec: auto
    rpiCameraIDRPeriod: 60
    rpiCameraTextOverlayEnable: true
    rpiCameraTextOverlay: '%Y-%m-%d %H:%M:%S'
    rpiCameraDenoise: "off"

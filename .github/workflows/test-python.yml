name: Python Tests

on:
  push:
    branches: [main]
    paths: ["client/**"]
  pull_request:
    branches: [main]
    paths: ["client/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors psutil pyyaml pytest
          # Skip pybluez in CI - it needs system bluetooth libs
          # The test suite mocks bluetooth imports

      - name: Run tests
        working-directory: client
        run: pytest tests/ -v
